name: QS homepage browser QA

on:
  pull_request:
    paths:
      - 'src/App.jsx'
      - 'src/components/HomeServiceCategories.jsx'
      - 'src/components/HomeHowItWorks.jsx'
      - 'src/components/FeaturedWork.jsx'
      - 'src/styles/**'
      - 'tests/browser/**'
      - '.github/workflows/qs-browser-qa.yml'
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install isolated browser test tools
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/qs-vite.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qs-vite.log
          exit 1
      - name: Run browser journeys
        run: npx playwright test tests/browser/qs-home.spec.mjs --config=playwright.config.mjs
      - name: Upload screenshots and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qs-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
